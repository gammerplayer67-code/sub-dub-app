name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create and Configure Android Scaffold
        run: |
          mkdir -p temp_scaffold
          cd temp_scaffold
          flutter create --org com.teamseven.subdub --platforms android sub_dub_app
          cp -r sub_dub_app/android ../
          cd ..
          rm -rf temp_scaffold

          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle || true

          cat << 'EOF' >> android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
                  maven { url 'https://artifactory.appodeal.com/appodeal-public' }
              }
          }
          EOF

          if [ -f android/settings.gradle ]; then
            sed -i '/FAIL_ON_PROJECT_REPOS/d' android/settings.gradle || true
            sed -i '/repositoriesMode.set/d' android/settings.gradle || true
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
